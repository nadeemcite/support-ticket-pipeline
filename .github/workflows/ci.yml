name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Tests (offline; no API keys in CI)
        run: pytest -q -m "not live"
      - name: Stub pipeline run
        run: python run_pipeline.py --provider stub --out-dir "$RUNNER_TEMP/out"
      - name: Validate the artifacts
        run: python validate.py --out-dir "$RUNNER_TEMP/out"
