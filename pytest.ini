[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
markers =
    stage1: Stage 1 - foundations (config, schemas, loading, normalisation, PII, stage machine)
    stage2: Stage 2 - retrieval & evidence
    stage3: Stage 3 - LLM layer & classification
    stage4: Stage 4 - drafting, guards, grounding & escalation
    stage5: Stage 5 - validation, orchestration, replay
    live: needs network / API keys (never run in the default suite)
